<body>

		<div>
			<h1 class="texto">
				Meu nome é: Adriana

			<p class="texto2">

		</div>
	</div>

	<div class="box">

		<div style="width: 100px; height: 100px; border-radius: 25px;">
			<img style="width: 100%;  height: 100%; margin-top: 20px;"
				src="https://cdn-icons-png.flaticon.com/256/3681/3681928.png" alt="">
		</div>

		<div>
			<h1 class="texto">
				Meu nome é: Hugo
			</h1>

			<p class="texto2">
				Mensagem: Um dia é da caça, o outro é do caçador.
			</p>
		</div>
	</div>
